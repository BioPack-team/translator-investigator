name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync tooling
        run: uv sync
      - name: Lint + type-check + format-check (ruff, ty, mdformat)
        run: uv run task check
